name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: fmt + clippy + cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  test:
    name: bun tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      # macOS: Bun uses Apple's system SQLite, which cannot load
      # extensions. The tests call setupSQLite(), which needs a Homebrew
      # SQLite — the same setup a user on Mac needs.
      - name: Install Homebrew SQLite (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite
      - run: npm ci
      - run: cargo build --release --features build_extension
      - run: bun test test/
      - run: npm run typecheck
      - run: bun examples/basic.ts
